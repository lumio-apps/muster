name: Build check

# Test run: analyze, test and build. Does NOT sign or publish a release.
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: muster-windows-test
          path: build/windows/x64/runner/Release/
          retention-days: 7